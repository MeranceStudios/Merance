<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&display=swap" rel="stylesheet">
</head>
<body>
	<video autoplay loop muted playsinline id="bg-video" style="position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:-1;"><source src="video/Background%20video.mp4" type="video/mp4"></video>
	<header class="main-header">
		<nav class="navbar">
			<button class="hamburger" id="hamburger-btn" aria-label="Open menu">
				<span></span>
				<span></span>
				<span></span>
			</button>
			<form class="search-form" action="#" method="get">
				<input type="text" class="search-input" placeholder="Search..." name="search">
				<button type="submit" class="search-btn">Search</button>
			</form>
			<div class="dropdown-menu" id="dropdown-menu">
				<ul class="hamburger-menu">
					<li class="hamburger-item shop-item">
						<button id="hamburgerShopToggle" class="nav-button">Shop ▸</button>
						<ul id="hamburgerShopDropdown" class="dropdown-menu nested-menu" aria-label="Shop submenu">
							<li><a href="../Shop/New Arrivals.html">New Arrivals</a></li>
							<li><a href="../Shop/collection.html">Collections</a></li>
							<li><a href="../Shop/sale.html">Sale</a></li>
						</ul>
					</li>
					<li class="hamburger-item"><a href="index.html">Home</a></li>
					<li class="hamburger-item"><a href="about.html">About Us</a></li>
				</ul>
			</div>
		</nav>
	</header>
			<h1>MERANCE</h1>
			<script>
			// Slide out search bar animation
			document.addEventListener('DOMContentLoaded', function() {
				const searchForm = document.querySelector('.search-form');
				const searchInput = document.querySelector('.search-input');
				const searchBtn = document.querySelector('.search-btn');
				const hamburger = document.getElementById('hamburger-btn');
				const dropdown = document.getElementById('dropdown-menu');
				const shopToggle = document.getElementById('hamburgerShopToggle');
				const shopDropdown = document.getElementById('hamburgerShopDropdown');
				searchInput.style.transition = 'width 0.2s cubic-bezier(.7,0,.3,1), opacity 0.2s';
				searchInput.style.width = '0px';
				searchInput.style.opacity = '0';
				searchInput.style.overflow = 'hidden';
				searchBtn.addEventListener('click', function(e) {
					if (searchInput.style.width === '0px' || searchInput.style.opacity === '0') {
						e.preventDefault();
						searchInput.style.width = '160px';
						searchInput.style.opacity = '1';
						searchInput.focus();
					}
				});
				// Optional: hide again when focus is lost
				searchInput.addEventListener('blur', function() {
					setTimeout(() => {
						searchInput.style.width = '0px';
						searchInput.style.opacity = '0';
					}, 200);
				});
				// Hamburger menu toggle
				hamburger.addEventListener('click', function(e) {
					e.stopPropagation();
					dropdown.classList.toggle('active');
				});

				// Toggle nested Shop submenu inside hamburger
				if (shopToggle) {
					shopToggle.addEventListener('click', function(e){
						e.stopPropagation();
						shopDropdown.classList.toggle('active');
						// rotate arrow glyph for visual cue
						this.textContent = shopDropdown.classList.contains('active') ? 'Shop ▾' : 'Shop ▸';
					});
				}
				// Hide dropdown and nested submenu when clicking outside
				document.addEventListener('click', function(e) {
					if (!hamburger.contains(e.target) && !dropdown.contains(e.target)) {
						dropdown.classList.remove('active');
						if (shopDropdown) shopDropdown.classList.remove('active');
					}
				});

				// Close on Escape
				document.addEventListener('keydown', function(e){
					if (e.key === 'Escape') {
						dropdown.classList.remove('active');
						if (shopDropdown) shopDropdown.classList.remove('active');
					}
				});
			});
			</script>
		<script>
		// Slide out search bar animation
		document.addEventListener('DOMContentLoaded', function() {
			const searchForm = document.querySelector('.search-form');
			const searchInput = document.querySelector('.search-input');
			const searchBtn = document.querySelector('.search-btn');
			searchInput.style.transition = 'width 0.2s cubic-bezier(.7,0,.3,1), opacity 0.2s';
			searchInput.style.width = '0px';
			searchInput.style.opacity = '0';
			searchInput.style.overflow = 'hidden';
			searchBtn.addEventListener('click', function(e) {
				if (searchInput.style.width === '0px' || searchInput.style.opacity === '0') {
					e.preventDefault();
					searchInput.style.width = '160px';
					searchInput.style.opacity = '1';
					searchInput.focus();
				}
			});
			// Optional: hide again when focus is lost
			searchInput.addEventListener('blur', function() {
				setTimeout(() => {
					searchInput.style.width = '0px';
					searchInput.style.opacity = '0';
				}, 200);
			});
		});
		</script>
</body>
</html>
