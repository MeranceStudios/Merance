<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale - Merance</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <video autoplay loop muted playsinline id="bg-video">
        <source src="../Home%20page/video/Background%20video.mp4" type="video/mp4">
    </video>
    <header class="main-header">
        <nav class="navbar">
            <button class="hamburger" id="hamburger-btn" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li class="nav-item shop-item">
                    <button id="shopToggle" class="nav-button" aria-haspopup="true" aria-expanded="false">Shop ▾</button>
                    <div id="shopDropdown" class="dropdown-menu" role="menu" aria-label="Shop submenu">
                        <a href="New Arrivals.html">New Arrivals</a>
                        <a href="collection.html">Collections</a>
                        <a href="sale.html">Sale</a>
                    </div>
                </li>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../about.html">About Us</a></li>
            </ul>
            <form class="search-form" action="#" method="get">
                <input type="text" placeholder="Search..." name="search">
                <button type="submit">Search</button>
            </form>
        </nav>
    </header>

    <main>
        <h1 style="text-align:center;margin-top:2rem;">Sale</h1>
        <p style="max-width:800px;margin:1rem auto;text-align:center;color:#222;">Sale items and discounts will be shown here.</p>
    </main>

    <script>
        (function(){
            const toggle = document.getElementById('shopToggle');
            const dropdown = document.getElementById('shopDropdown');
            function setOpen(open){
                dropdown.classList.toggle('active', open);
                toggle.setAttribute('aria-expanded', String(!!open));
            }
            if (toggle) {
                toggle.addEventListener('click', function(e){
                    e.stopPropagation();
                    setOpen(!dropdown.classList.contains('active'));
                });
            }
            document.addEventListener('click', function(){ setOpen(false); });
            document.addEventListener('keydown', function(e){ if(e.key === 'Escape') setOpen(false); });
        })();
    </script>
</body>
</html>
